# Engyne — Render Blueprint
# Deploy from repo root. Set secrets in Render Dashboard after first sync.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: engyne-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Engyne
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@engyne.example
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: noreply@engyne.example
      - key: ADMIN_REPORT_EMAIL
        sync: false
      - key: INVOICE_PREFIX
        value: ENGY
      - key: TAX_RATE_PERCENT
        value: "18"
      - key: COMPANY_NAME
        value: Engyne
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
